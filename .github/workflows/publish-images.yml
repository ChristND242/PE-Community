name: Publish release images

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      build_date: ${{ steps.release.outputs.build_date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          fetch-tags: false
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          bash .github/scripts/validate-release-ref.sh

  image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/pona-ekolo/pe-community-api:${{ needs.validate.outputs.version }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            SOURCE_COMMIT=${{ needs.validate.outputs.source_commit }}
            BUILD_DATE=${{ needs.validate.outputs.build_date }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/pona-ekolo/pe-community-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/pona-ekolo/pe-community-web:${{ needs.validate.outputs.version }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            SOURCE_COMMIT=${{ needs.validate.outputs.source_commit }}
            BUILD_DATE=${{ needs.validate.outputs.build_date }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/pona-ekolo/pe-community-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/pona-ekolo/pe-community-worker:${{ needs.validate.outputs.version }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            SOURCE_COMMIT=${{ needs.validate.outputs.source_commit }}
            BUILD_DATE=${{ needs.validate.outputs.build_date }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/pona-ekolo/pe-community-worker
          subject-digest: ${{ steps.worker.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [validate, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pe/updater build
      - name: Build final release artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_DATE: ${{ needs.validate.outputs.build_date }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          API_DIGEST: ${{ needs.image.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
          WORKER_DIGEST: ${{ needs.image.outputs.worker_digest }}
        run: |
          set -euo pipefail
          for digest in "$API_DIGEST" "$WEB_DIGEST" "$WORKER_DIGEST"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Image digest is missing or invalid." >&2; exit 1; }
          done
          jq -n \
            --arg version "$VERSION" \
            --arg buildDate "$BUILD_DATE" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg apiDigest "$API_DIGEST" \
            --arg webDigest "$WEB_DIGEST" \
            --arg workerDigest "$WORKER_DIGEST" \
            '{schemaVersion:2,releaseContractVersion:1,version:$version,releaseTag:$version,channel:"stable",minimumVersion:"v0.1.0",minimumUpdaterVersion:"v1.3.0",sourceCommit:$sourceCommit,buildDate:$buildDate,images:{api:{repository:"ghcr.io/pona-ekolo/pe-community-api",digest:$apiDigest},web:{repository:"ghcr.io/pona-ekolo/pe-community-web",digest:$webDigest},worker:{repository:"ghcr.io/pona-ekolo/pe-community-worker",digest:$workerDigest}},database:{migrationCompatibility:"FORWARD_ONLY"},supplyChain:{attestationPolicy:"GITHUB_PROVENANCE_REQUIRED"},requiresManualAction:false}' \
            > pe-community-update-manifest.json
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const { validateManifest } = await import('./apps/updater/dist/domain.js'); validateManifest(JSON.parse(readFileSync('pe-community-update-manifest.json', 'utf8')))"

          mkdir -p pe-community-updater/dist pe-community-updater/deploy
          cp -R apps/updater/dist/. pe-community-updater/dist/
          cp apps/updater/package.json pe-community-updater/package.json
          cp deploy/updater/README.md deploy/updater/SECURITY.md deploy/updater/pe-community-updater.env.example deploy/updater/pe-community-updater.service pe-community-updater/deploy/
          tar -czf "pe-community-updater-${VERSION}.tar.gz" pe-community-updater
      - id: manifest-attestation
        name: Attest final update manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: pe-community-update-manifest.json
      - name: Prepare attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.manifest-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" pe-community-update-manifest.attestation.json
      - name: Create validated draft and publish atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.version }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          node .github/scripts/publish-release-draft.mjs
