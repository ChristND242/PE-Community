name: Publish container images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish GHCR images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow publishes images only from a Git tag."
            exit 1
          fi

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic release tag such as v1.0.0."
            exit 1
          fi

          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pona-ekolo/pe-community-api:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/Pona-Ekolo/PE-Community
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.title=PE Community API
            org.opencontainers.image.description=PE Community API service
          cache-from: type=gha,scope=pe-community-api
          cache-to: type=gha,mode=max,scope=pe-community-api

      - name: Build and push Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pona-ekolo/pe-community-worker:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/Pona-Ekolo/PE-Community
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.title=PE Community Worker
            org.opencontainers.image.description=PE Community background worker
          cache-from: type=gha,scope=pe-community-worker
          cache-to: type=gha,mode=max,scope=pe-community-worker

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_REALTIME_ORIGIN=
          tags: |
            ghcr.io/pona-ekolo/pe-community-web:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/Pona-Ekolo/PE-Community
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.title=PE Community Web
            org.opencontainers.image.description=PE Community authenticated web application
          cache-from: type=gha,scope=pe-community-web
          cache-to: type=gha,mode=max,scope=pe-community-web
