name: Feature request
description: Suggest a focused product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the expected behavior without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy and compatibility considerations
      description: Note permission, encrypted-chat, migration, or deployment concerns.
