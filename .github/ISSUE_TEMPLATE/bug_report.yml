name: Bug report
description: Report a reproducible product defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose vulnerabilities, credentials, private keys, recovery codes, or personal data here. Follow SECURITY.md for private security reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit identifier, without private repository details.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use fictional or redacted data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and deployment method. Redact hosts and secrets.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Remove tokens, cookies, email addresses, message content, and credentials before pasting logs.
